name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Only Linux ships in Phase 1, but the agent must stay portable — the Connector
    # and Enforcer interfaces must not bake in Linux assumptions (docs/decisions.md D9).
    # Building on all three keeps that claim honest rather than aspirational.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # The D9 claim Windows carries is COMPILE portability — the interfaces bake in
      # no Linux assumptions — which build+vet prove. The behavioural suite is POSIX
      # by nature (fanotify, Unix file-mode 0600/0700 assertions, KILL syscalls,
      # /bin/sleep, forward-slash paths) and Phase 1 ships Linux only (Windows/macOS
      # agents are explicitly out of Phase 1), so it cannot and should not pass on
      # Windows. Run -race on the POSIX platforms (ubuntu = the ship target, macOS a
      # second POSIX check); revisit per-test skips only if Windows becomes a target.
      - if: runner.os != 'Windows'
        run: go test -race ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  proto:
    # Generated code is committed so contributors need no protoc. This proves it
    # still matches its sources — hand-edited generated code is otherwise
    # invisible until something behaves strangely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # PINNED TO THE RUNTIME VERSION IN go.mod, for two reasons that point the same way.
      #
      # SUPPLY CHAIN: this generator WRITES CODE THAT ENTERS THE BUILD. `@latest` meant a hijacked
      # protobuf release could emit whatever it liked into the .pb.go files, in the one job whose output
      # is then compared against the committed tree — so the comparison would agree with the attacker.
      # Of the two unpinned installs this workflow had, this was the dangerous one.
      #
      # CORRECTNESS: a generator newer than the runtime it generates against can emit code the runtime
      # does not support. Keeping the two equal is the only version relationship that is defensible;
      # bump this line when go.mod's google.golang.org/protobuf moves.
      - name: install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: generated code is current
        run: make proto-check

  invariants:
    # The contract tests are ordinary `go test`, run above on all platforms.
    # This job exists to name them, because a green check labelled "test" does
    # not communicate that these specific properties are being enforced.
    #
    #   TestActionEnumIsClosed                    the action set stays closed (D14)
    #   TestDecisionCarriesNoParameters           no action parameters can be smuggled in
    #   TestClassificationSummaryFieldSetIsExact  only four fields may cross the host boundary
    #   TestClassificationSummaryLeaksNothing     no secret or digest of it reaches the wire
    #   TestEnforcerIsolationFailsToCompile       an enforcer CANNOT see classifier internals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: contract and privacy invariants
        run: go test -run 'TestAction|TestDecision|TestClassification|TestEvent|TestFilesystem|TestEnforcerIsolation|TestTransportRejects|TestPhase1' -v ./internal/core/
      - name: pipeline invariants
        run: go test -run 'TestStage|TestDispatch|TestReentry|TestFailingStage|TestSlowStage|TestTimeouts|TestNoDecision|TestReplay' -v ./internal/core/
      - name: architectural fitness (necessary, not sufficient — see D26)
        run: go test -v ./internal/fitness/
      - name: doc honesty — no unqualified overclaims on claim surfaces (T-029)
        run: go test -v ./internal/doccheck/
      - name: core has no broker dependency
        run: ./scripts/check-core-deps.sh
      - name: core depends on no concrete capability (T-014)
        run: ./scripts/check-capability-boundary.sh
      - name: open code does not import enterprise code (T-021)
        run: ./scripts/check-opencore-boundary.sh check && ./scripts/check-opencore-boundary.sh --selftest
      - name: privileged agent has no parser dependency
        run: ./scripts/check-agent-deps.sh
      # UNWIRED FEATURES are this repository's most frequent defect — a complete, unit-tested,
      # documented package that no binary imports, and therefore cannot run in any deployment however
      # configured. internal/connectors/smtp was exactly that while the README described live SMTP
      # inspection. Unit tests cannot catch it (a package's own tests import it, so they pass either
      # way) and neither can `go build ./...` (it happily compiles a library nothing links). The import
      # closure of ./cmd/... is the only cheap signal, so it runs here and not only in `make quick`.
      - name: every package is reachable from a shipped binary
        run: ./scripts/check-cmd-closure.sh
      # KNOWN-VULNERABLE DEPENDENCIES, and this was missing while the sophisticated half shipped.
      # PLAT-6 builds reproducibly, signs a manifest and signs an SBOM — it attests in detail to WHAT
      # went into a release and never asked whether any of it had a published advisory. When this step
      # was first run it found a REACHABLE one: GO-2026-5970, an infinite loop on invalid input in
      # golang.org/x/text, reached from the control plane's own pgxpool.New. For a product whose threat
      # model is largely about not wedging, a remote input that can spin the control plane forever is
      # the shape that matters, not the CVSS.
      #
      # govulncheck rather than an SBOM-versus-OSV diff, deliberately: it does REACHABILITY analysis, so
      # it separates "we require a module with an advisory" (2 today, uncalled) from "our code calls the
      # vulnerable symbol" (0). Without that distinction the check either cries wolf or gets ignored,
      # and an ignored security check is worse than none.
      #
      # THE VERSION IS PINNED, and the first draft of this step was not — it said `@latest`, which is a
      # supply-chain risk introduced BY a supply-chain check. `go install ...@latest` runs whatever that
      # module publishes next, in CI, with the workflow's context; a hijacked release would execute there
      # before it ever reached a developer. It also makes the check non-reproducible: a new release can
      # change findings and fail the build with no code change, and a security gate that breaks on its own
      # schedule is a gate people learn to bypass.
      #
      # The vulnerability DATABASE is still fetched live, which is the point of it — pinning the scanner
      # is not meant to pin what is known.
      - name: no reachable known vulnerabilities in dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: enforcement dispatch + quarantine (post-decision, observe-only default)
        run: go test -count=1 -v ./internal/engine/ ./internal/enforcers/...
      - name: NIPS-2 threat-intel engine (IOC match + policy blocks a known-bad flow)
        run: go test -count=1 -v ./internal/nips/ && go test -count=1 -run 'GatewayBlocksKnownBad|GatewayAllowsClean|GatewayNoFeed' -v ./internal/gateway/
      - name: NIPS-4 response-body inspection (classify+audit the response, gzip, over-cap intact, fail-open)
        run: go test -count=1 -run ResponseInspection -v ./internal/gateway/
      - name: SIEM-7 MITRE ATT&CK mapping (signal→technique; policy routes on a technique)
        run: go test -count=1 -v ./internal/attack/ && go test -count=1 -run TestAttackTechniqueAwarePolicy -v ./internal/policy/
      - name: SIEM-4 CEF log parser (headers + extension escaping; malformed rejected)
        run: go test -count=1 -v ./internal/connectors/cef/
      - name: DLP-3 exact-data matching (k-anonymized bloom index, no raw value shipped)
        run: go test -count=1 -run 'EDM|BuildEDM|RecordEDM|IDM' -v ./internal/classify/
      - name: DLP-7 context-proximity detection (passport/DL fire only near a context keyword)
        run: go test -count=1 -run "Passport|DriversLicense|Context" -v ./internal/classify/
      - name: DLP-2 exfil-channel awareness (path→channel; policy escalates on an exfil channel)
        run: go test -count=1 -v ./internal/exfil/ && go test -count=1 -run TestExfilChannelAwarePolicy -v ./internal/policy/
      - name: agent process-boundary invariants
        run: go test -run 'TestFrame|TestOversized|TestTruncated|TestClassifierError|TestUnreadable|TestByteCeiling|TestWorkerRefuses|TestPrivilegedTalks|TestWorkerTimeout' -v ./internal/agent/
      # THE SUITE ON A 32-BIT ARCHITECTURE. Nothing ever ran it there, and the agent compiles for
      # GOARCH=386 and GOARCH=arm today — so `int(someUint32FromTheWire)` was -1 on those platforms,
      # every "is this length past the ceiling?" check passed, and the slice that followed panicked.
      # Three decoders in the privileged agent had it, and one of them was already covered by a test
      # named for the exact property that failed. It passed on amd64 forever.
      #
      # These packages are the ones that decode a length they did not choose: kernel event structures,
      # IPC frames, signed index blobs. Cheap, and it is the only thing standing between that class of
      # bug and a 32-bit endpoint.
      # SCOPED TO THE DECODERS, and the exclusion is stated rather than left as a shrug: `internal/agent`
      # itself is NOT here because its test builds and execs the real worker, and THE WORKER CANNOT START
      # ON i386 AT ALL — its seccomp denylist names `accept`, which is not a syscall on that architecture,
      # so the filter fails to assemble and the worker refuses to parse without a sandbox. That is the
      # safe direction and it is a real platform gap; see docs/unwired-audit.md round 45. Running it here
      # would report that gap as a decoder failure, which is the wrong diagnosis in the wrong place.
      - name: wire and kernel decoders on 32-bit (int is 32 bits there; a uint32 length becomes -1)
        env:
          GOARCH: "386"
        run: go test -count=1 ./internal/agent/execmon/ ./internal/agent/openmon/ ./internal/agent/openipc/ ./internal/agent/execipc/ ./internal/classify/ ./internal/connectors/fanotify/ ./internal/core/
      # The fuzz targets' SEED CORPUS runs on every ordinary `go test`; this is the only step that
      # actually MUTATES input, and it is a SMOKE TEST — this budget explores almost none of the
      # space, so finding nothing here is close to no evidence. The durable value is that a crasher
      # found in a long local run gets committed under testdata/fuzz/ and is replayed forever after.
      #
      # THE BUDGET IS EXECUTIONS, NOT SECONDS, and it was `-fuzztime=20s` until that turned the step
      # red on a commit that changed nothing about it. `FuzzReadRequest` on openipc failed with
      # `context deadline exceeded`: throughput dropped to 0/sec exactly at the 20s mark and a worker
      # did not return from its current input before the coordinator's deadline. It passes locally,
      # where 32 workers run 900k execs/sec; the runner had 4 workers at 45k/sec — 20× slower, on
      # inputs up to MaxPrefixLen (64 KiB), which is why openipc/execipc hit this and the
      # small-input execmon/openmon targets did not.
      #
      # "Twenty seconds of fuzzing" is not a reproducible amount of work on a shared runner, and a
      # gate whose result depends on how busy the machine was is a gate people learn to re-run until
      # it passes. `-fuzztime=Nx` counts EXECUTIONS: the same work every time, no wall-clock deadline
      # for a worker to lose a race against. A real crasher still fails the step, which is the only
      # property that mattered.
      #
      # THE EXECIPC BUDGET IS SMALLER, AND THAT IS NOT ARBITRARY — do not normalize it. Measured on a
      # 32-core machine: openipc's FuzzReadRequest runs ~900,000 execs/sec, execipc's identical-shaped
      # one runs ~250/sec. A 3600× gap between two decoders that are each O(n) over n ≤ 4096, with the
      # fuzz body benchmarked at 290 ns/op — so it is not the code under test.
      #
      # The cause is the TEST BINARY, which is what Go instruments and whose coverage counters it
      # snapshots on every execution. `go list -deps -test` reports 23 openshield packages for execipc
      # against 4 for openipc: its gate_test.go and kernel_linux_test.go pull in engine, policy,
      # watchdog, execmon and execguard. Fuzzing pays for all of it, per execution.
      #
      # Splitting those heavier tests into their own package would make the wire fuzzer ~3600× faster
      # and is the real fix; it is a test-layout change with its own risk and belongs in its own
      # ticket, not in a CI tuning commit. Until then the budget follows the measured throughput, so
      # that what this step costs is predictable and what it buys is not overstated.
      - name: fuzz smoke over the privileged decoders (NOT a soak)
        run: |
          set -e
          for t in FuzzDecodeMeta FuzzDecodeInotify; do
            go test -run '^$' -fuzz "^${t}$" -fuzztime=100000x ./internal/agent/execmon/
          done
          go test -run '^$' -fuzz '^FuzzDecodeMeta$' -fuzztime=100000x ./internal/agent/openmon/
          for t in FuzzReadRequest FuzzReadResponse; do
            go test -run '^$' -fuzz "^${t}$" -fuzztime=100000x ./internal/agent/openipc/
            # See the note above: ~250 execs/sec here because the test binary links the pipeline.
            go test -run '^$' -fuzz "^${t}$" -fuzztime=3000x ./internal/agent/execipc/
          done

  ledger:
    # The audit ledger's storage layer is tested against a REAL PostgreSQL.
    #
    # It has to be. The bug that motivated this job was invisible to every
    # in-memory test: TIMESTAMPTZ stores microseconds while the canonical
    # encoding commits to nanoseconds, so an entry sealed with a real
    # time.Now() verified as TAMPERED the moment it was read back. A fake
    # storage layer would have agreed with the code.
    #
    # OPENSHIELD_REQUIRE_POSTGRES turns the local skip into a hard failure
    # here, because an integration suite that skips silently and reports ok is
    # worse than no suite at all — it manufactures confidence.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openshield
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: openshield
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U openshield"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: audit ledger against real PostgreSQL
        env:
          OPENSHIELD_REQUIRE_POSTGRES: '1'
        run: go test -race -count=1 -v ./internal/store/...
      - name: a failed append is never silent
        run: go test -run 'TestUnreachableLedger|TestTimeoutIsRecorded|TestNoDecisionIsStillRecorded' -v ./internal/core/
      - name: CLI verifies, never hides a break, and separates its exit codes
        run: go test -count=1 -v ./internal/cli/
      - name: XDR-1 entity model — canonical-pseudonym join + atomic resolve/merge (real Postgres)
        env:
          OPENSHIELD_REQUIRE_POSTGRES: "1"
        run: go test -count=1 -v ./internal/xdr/
      - name: control plane persists agent telemetry (embedded NATS + Postgres)
        env:
          OPENSHIELD_REQUIRE_POSTGRES: "1"
        run: go test -count=1 -v ./internal/controlplane/
      - name: agent identity signing (per-agent keys, no shared secret)
        run: go test -count=1 -v ./internal/agent/identity/
      - name: XDR-3 canonical subject stamping (endpoint events attributed + contract-validated)
        run: go test -count=1 -run "EngineStamps|EngineRejects|Unconfigured" -v ./internal/engine/
      - name: walking skeleton — one event classify→policy→audit (real worker + Postgres)
        env:
          OPENSHIELD_REQUIRE_POSTGRES: "1"
        run: go test -count=1 -v ./internal/engine/
      - name: fanotify observe front-end (real file change → audit, unprivileged)
        env:
          OPENSHIELD_REQUIRE_POSTGRES: "1"
        run: go test -count=1 -v ./internal/connectors/fanotify/

  attestation:
    # The TPM attestation core (internal/attest, ZT-1) is tested against a REAL
    # software TPM. swtpm speaks the same TPM 2.0 protocol as a hardware TPM, so
    # the quote generate/verify path — including the nonce anti-replay and the
    # ECDSA signature check — runs for real, not against a mock that would agree
    # with the code. requireSWTPM skips these tests where swtpm is absent (macOS,
    # Windows), so this job installs it to make the skip a real run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install swtpm
        run: sudo apt-get update && sudo apt-get install -y swtpm
      - name: TPM quote generate + nonce-fresh verify + EK activation + PCR policy (real swtpm)
        run: go test -race -count=1 -v ./internal/attest/
      - name: gateway attestation — verifier, access, transport, enrollment, re-attestation, network-enroll (real swtpm)
        run: go test -race -count=1 -run 'Attestation|Enrollment|Reattest|NetworkEnrollment|ActivateWithout' -v ./internal/gateway/

  integration-suite:
    # THE SUITE THAT TESTS THE SHIPPED BINARIES RAN IN NO AUTOMATED GATE AT ALL.
    #
    # The `ledger` job above runs PACKAGE tests against a real Postgres, which is valuable and is
    # not this. `test/integration/` is the only place the built commands run as REAL PROCESSES — the
    # only place the wiring in cmd/ is exercised, which is precisely where a defect survives to a
    # deployment because every unit involved passes alone. It was reachable only through
    # `make integration` on a developer's machine.
    #
    # What that cost, concretely: seedTimeline in test/integration/timeline_test.go snapshotted its
    # ledger baseline AFTER writing the file it was waiting for. The engine records the row ~90ms
    # later, so on a fast machine the baseline already contained it and the test waited out its full
    # 60s timeout for a second row that was never coming. Two tests, deterministically failing here,
    # and nothing automated was looking.
    #
    # THE SKIP IS THE TRAP. The suite calls t.Skip when podman is absent, so the naive version of this
    # job passes green while running nothing — the same "manufactures confidence" failure the ledger
    # job's own comment names. `podman --version` runs as its own step first, so a runner without it
    # fails the job instead of quietly skipping every scenario. OPENSHIELD_REQUIRE_POSTGRES=1 closes
    # the other half.
    #
    # Root/VM-gated scenarios (fanotify permission mode, tproxy, the exec gate) still skip here and are
    # covered on the rooted VM instead — a genuine and recorded limit, not a silent one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: podman must be present, or the suite would skip and report ok
        run: podman --version
      - name: the shipped binaries, as real processes against real infrastructure
        env:
          OPENSHIELD_REQUIRE_POSTGRES: '1'
        run: go test -tags integration -count=1 -timeout 40m ./test/integration/...

  # Still to come, each its own ticket:
  #
  # These substitute for the line-level review depth a non-coding maintainer
  # cannot provide (CONTRIBUTING.md).
