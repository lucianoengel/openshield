syntax = "proto3";

package openshield.v1;

option go_package = "github.com/lucianoengel/openshield/internal/core/corev1;corev1";

import "google/protobuf/timestamp.proto";

// ThreatCategory is the closed set of network threat-intel signal kinds (NIPS-2).
// It is DISTINCT from the DLP DetectorType: a DLP detector flags sensitive CONTENT
// (and its enum is closed to avoid leaking what was detected), whereas a threat
// match flags a known-bad DESTINATION or request — public threat-intel, already in
// the flow's metadata. Conflating them would be a category error.
enum ThreatCategory {
  THREAT_CATEGORY_UNSPECIFIED = 0;
  // The flow's host is, or is a subdomain of, a known-bad domain.
  THREAT_CATEGORY_IOC_DOMAIN = 1;
  // The flow's destination IP is a known-bad address or in a known-bad CIDR.
  THREAT_CATEGORY_IOC_IP = 2;
  // The request path matches a network URI signature.
  THREAT_CATEGORY_URI_SIGNATURE = 3;
  // The flow BODY matched an operator content signature (NIPS-2 body-content
  // engine), matched in the sandboxed worker. The indicator id is the rule id;
  // the matched bytes never cross the classification boundary.
  THREAT_CATEGORY_CONTENT_SIGNATURE = 4;
  // The flow's TLS CLIENT fingerprint (JA3) matched a known-bad one — the only
  // category here that describes the client rather than the destination, and so the
  // only one that still says something when the domain is new, rotated or encrypted
  // away. Weaker than the others by nature: a JA3 identifies a TLS library at a
  // version, shared by every program built on it, so a match is evidence and not
  // proof. Its confidence is reported below 1.0 to say so.
  THREAT_CATEGORY_JA3 = 5;
}

// ThreatMatch is one threat-intel hit on a flow. It carries the category and a
// confidence (1.0 for a definitive IOC match) and an OPAQUE indicator id (a feed or
// rule identifier an analyst can trace) — never the matched content, so the
// classification-crossing stays free of raw matched strings.
message ThreatMatch {
  ThreatCategory category = 1;
  double confidence = 2;
  string indicator_id = 3;
}

// ThreatClassification holds the threat matches for a flow — the network analogue
// of the DLP LocalClassification, on its own axis.
message ThreatClassification {
  string event_id = 1;
  repeated ThreatMatch matches = 2;
}

// IntentVerb is the CLOSED vocabulary of coordinated response (ADR-12 Tier-2, SOAR-7).
//
// Closed for the same reason Action is (D14): the threat is a compromised control plane expressing an
// arbitrary action that an endpoint then performs. Three verbs, each meaning something a LOCAL policy
// interprets — the server publishes DATA, the endpoint decides. Adding a member here is a one-at-a-time
// owner decision and must also edit the enum-completeness test.
enum IntentVerb {
  INTENT_VERB_UNSPECIFIED = 0;
  // Watch this subject harder: a policy may lower thresholds, sample more, or require step-up auth.
  INTENT_VERB_ELEVATE_SCRUTINY = 1;
  // Contain this subject: a policy may block its flows and refuse its new executions. HIGH-IMPACT —
  // publication requires a four-eyes approval and a bounded blast radius.
  INTENT_VERB_CONTAIN = 2;
  // Stop trusting this subject's credentials: a policy may refuse its tokens and require re-attestation.
  // HIGH-IMPACT.
  INTENT_VERB_REVOKE_TRUST = 3;
}

// ResponseIntent is the control plane's coordinated-response signal (SOAR-7/ADR-12 Tier-2).
//
// It is DATA, not an instruction. A consumer verifies the signature, reads it as typed policy CONTEXT, and
// its own policy decides what the verb means for it — an endpoint whose policy ignores intents is
// unaffected, which is a property of the design rather than a gap in it.
//
// It carries no content (D10/D29): a pseudonymous subject (D23), a closed verb, and time bounds.
message ResponseIntent {
  string intent_id = 1;                          // stable id; the four-eyes approval is bound to it
  IntentVerb verb = 2;
  string subject = 3;                            // pseudonymous subject or entity key (D23)
  uint32 version = 4;                            // consumers reject a version they do not understand
  google.protobuf.Timestamp issued_at = 5;
  // expires_at is MANDATORY in practice: a contain with no expiry is a permanent quarantine nobody
  // remembers issuing. A consumer treats an expired intent as absent, so a stale containment cannot
  // outlive the control plane that issued it.
  google.protobuf.Timestamp expires_at = 6;
  string reason = 7;                             // operator-facing justification; never content
}

// FleetVerb is the CLOSED vocabulary of fleet-wide operational control (PLAT-9).
//
// DELIBERATELY NOT a fourth IntentVerb. Every member of that vocabulary CAUSES enforcement — contain,
// revoke trust, elevate scrutiny — and "stop enforcing" is its opposite. Folding them together would mean
// one signed-message type whose members both start and stop the product's action, and any consumer
// mis-handling the discriminator fails in the most dangerous possible direction.
//
// It is also the most attractive forgery target in the system: ONE accepted message turns the product off
// across a fleet. That is why it carries a monotonic SEQUENCE (a captured message cannot be replayed) and
// MANDATORY time bounds (a captured message cannot last), on top of the signature.
enum FleetVerb {
  FLEET_VERB_UNSPECIFIED = 0;
  // Stop ENFORCING fleet-wide. Detection, decisions and the audit trail continue — this is not "stop
  // seeing". Publication requires a four-eyes approval.
  FLEET_VERB_ENFORCEMENT_DISABLE = 1;
  // Resume enforcing. Signed too: a forged restore would undo a disable an operator engaged during an
  // incident.
  FLEET_VERB_ENFORCEMENT_RESTORE = 2;
}

// FleetControl is a signed fleet-wide operational instruction (PLAT-9).
//
// It carries no subject: it applies to every consumer, which is precisely what makes it dangerous and
// what the sequence and expiry bound.
message FleetControl {
  string control_id = 1;
  FleetVerb verb = 2;
  uint32 version = 3;                            // consumers reject a version they do not understand
  // sequence is MONOTONIC per control plane. A consumer refuses anything at or below the highest it has
  // applied, so a captured DISABLE cannot be replayed after an operator restored enforcement.
  uint64 sequence = 4;
  google.protobuf.Timestamp issued_at = 5;
  // expires_at is MANDATORY: a disable with no expiry is a product that is off and nobody remembers
  // turning off. A consumer treats an expired control as absent.
  google.protobuf.Timestamp expires_at = 6;
  string reason = 7;                             // operator-facing justification; never content
}
