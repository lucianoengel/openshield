syntax = "proto3";

package openshield.v1;

option go_package = "github.com/lucianoengel/openshield/internal/core/corev1;corev1";

import "google/protobuf/timestamp.proto";

// Purpose declares why an Event was collected. Purpose limitation that depends
// on discipline is not purpose limitation, so this is a schema field and the
// policy engine refuses cross-purpose evaluation (D20).
enum Purpose {
  PURPOSE_UNSPECIFIED = 0;
  PURPOSE_DLP = 1;
  PURPOSE_INSIDER_RISK = 2;
  PURPOSE_COMPLIANCE_AUDIT = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_FILE_OPENED = 1;
  EVENT_KIND_FILE_MODIFIED = 2;
  EVENT_KIND_FILE_CREATED = 3;
  EVENT_KIND_USB_INSERTED = 4;
  EVENT_KIND_NETWORK_FLOW = 5;
  EVENT_KIND_HTTP_REQUEST = 6;
  EVENT_KIND_DNS_QUERY = 7;    // a resolved DNS question (Phase C — DNS breadth)
  EVENT_KIND_SMTP_MESSAGE = 8; // an outbound SMTP message (Phase C — email breadth)
  EVENT_KIND_PROCESS_EXEC = 9; // a process execution (Phase E — HIPS)
  EVENT_KIND_FILE_DELETED = 10; // a watched file was removed (HIPS-4 FIM — a delete is a tamper signal)
  EVENT_KIND_RANSOMWARE_SUSPECTED = 11; // a mass canary change — a suspected ransomware attack (HIPS-4)
  EVENT_KIND_MEMORY_INJECTION_SUSPECTED = 12; // a process with writable+executable memory (HIPS-4 W^X)
  EVENT_KIND_CLIPBOARD_COPY = 13; // content copied to the clipboard (DLP-2a — an exfil CHANNEL, not a file)
  EVENT_KIND_PRINT_JOB = 14;      // a document submitted to a printer (DLP-2b — the other endpoint exfil channel)
  // DATA AT REST, found by a sweep rather than observed in motion (DSPM-1). Every kind above is something
  // that HAPPENED — a process opened, wrote, printed, sent. This one is something that IS: an object sitting
  // in a store, found because we went looking. Reusing FILE_OPENED would have been the cheap option and it
  // would misreport the event, because nobody opened it; and the difference is one policy needs, since
  // "this data exists here" and "someone touched this" justify different responses.
  EVENT_KIND_OBJECT_DISCOVERED = 15;
}

// Subject identifies WHO, pseudonymously. The mapping to a real identity lives
// outside the event stream behind an audited lookup — the event stream is the
// most widely copied, retained and queried artefact in the system (D23).
message Subject {
  string pseudonymous_id = 1;
}

// ParentAndName is fanotify's DFID_NAME shape: a parent-directory handle plus a
// filename. The name costs no capability; a name is not a path.
message ParentAndName {
  bytes parent_handle = 1;
  string name = 2;
}

// FilesystemSubject carries the three identity forms T-005 measured. Which one
// arrives follows from the coverage mode the agent selects, not from chance.
// See docs/spike-t005-fanotify.md.
message FilesystemSubject {
  oneof identity {
    // Classic mode: kernel supplies an fd, path follows from readlink.
    string resolved_path = 1;
    // FID mode (FAN_MARK_FILESYSTEM): opaque; resolving needs CAP_DAC_READ_SEARCH.
    bytes file_handle = 2;
    // DFID_NAME mode: parent handle + filename.
    ParentAndName parent_and_name = 3;
  }
}

message UsbSubject {
  string vendor_id = 1;
  string product_id = 2;
  string serial_pseudonym = 3;
}

// NetworkDirection is which way a flow crosses the gateway.
enum NetworkDirection {
  NETWORK_DIRECTION_UNSPECIFIED = 0;
  NETWORK_DIRECTION_EGRESS = 1;
  NETWORK_DIRECTION_INGRESS = 2;
}

// NetworkSubject is a network flow or L7 request the gateway observed (N1/D69).
// It carries connection/request METADATA ONLY — never the body content, which is
// classified in the gateway PROCESS and never leaves it (D10/D29), exactly as
// file content stays in the worker. flow_id is an opaque handle into the
// gateway's live flow table: the network analogue of a file path, what a flow
// enforcer resolves to a live connection to act on.
message NetworkSubject {
  string flow_id = 1;
  string src_ip = 2;
  uint32 src_port = 3;
  string dst_ip = 4;
  uint32 dst_port = 5;
  string protocol = 6; // tcp | udp | ...
  // L7 metadata, present when the gateway terminates TLS / sees plaintext. This
  // is METADATA (a policy decides on it), NOT the body.
  string sni_host = 7; // TLS SNI / HTTP Host
  string http_method = 8;
  string http_path = 9;
  NetworkDirection direction = 10;
  // JA3 client fingerprint of the TLS ClientHello (NIPS-9): an MD5 over the offered
  // version, ciphers, extensions and curves. It identifies the CLIENT STACK, which is
  // what makes it useful where SNI is not — a malware family keeps its fingerprint
  // across every domain it rotates through, and encrypted-SNI or a domain nobody has
  // seen before leaves this as the only metadata worth matching.
  //
  // It is a fingerprint of a handshake, not of a person: the same value is shared by
  // every client built on the same library at the same version, so it is a WEAK
  // signal on its own and is deliberately not an identifier (D23 is unaffected).
  string ja3 = 11;
}

// Event is what a producer emits. It carries metadata and references only —
// never file content (D10).
message Event {
  string event_id = 1;
  string agent_id = 2;
  string connector_id = 3;
  // Monotonic per agent. Gaps must be detectable: an audit trail that cannot
  // reveal suppression is not evidentiary.
  uint64 sequence = 4;
  google.protobuf.Timestamp observed_at = 5;
  Subject subject = 6;
  Purpose purpose = 7;
  EventKind kind = 8;

  oneof target {
    FilesystemSubject filesystem = 9;
    UsbSubject usb = 10;
    NetworkSubject network = 11;
    ProcessSubject process = 12;
    ClipboardSubject clipboard = 13;
    PrintSubject print = 14;
    ObjectSubject object = 15;
  }
}

// ProcessSubject is a process execution the HIPS producer observed (Phase E). It carries
// exec METADATA ONLY (D10/D29) — the executable path, the argument vector, the pid, and the
// parent's pid/path for lineage rules — never process memory or file content. pid is the
// enforcement target: what a KILL_PROCESS enforcer acts on, the process analogue of a
// file path or a flow_id.
message ProcessSubject {
  int32 pid = 1;
  int32 ppid = 2;
  string exec_path = 3;     // the executable being run
  repeated string args = 4; // the argument vector (metadata for lineage/LOLBin rules)
  string parent_path = 5;   // the parent process's executable (for lineage rules)
  // The process start-time in clock ticks (/proc/<pid>/stat field 22), captured at OBSERVATION.
  // With the pid it identifies the specific process instance, so an enforcement can revalidate at
  // kill time and spare a recycled pid (HIPS-7). 0 = unknown (the process had exited at capture).
  uint64 start_ticks = 6;
}

// ClipboardSubject is a clipboard copy the endpoint observed (DLP-2a). It is the exfil channel a desktop
// user actually reaches for, and it has no path — so it carries the only two facts that are both useful
// and content-free: how much was copied, and which display server it came from.
//
// There is DELIBERATELY no field here that could hold the copied text. The copied bytes go to the
// SANDBOXED WORKER as inline classify content (D71/D29) and never onto an Event, so a clipboard event
// cannot express content even by mistake (D10). The Event-tree bytes-field guard in
// internal/core/schema_test.go passes with its allowlist UNCHANGED, which is the mechanical proof of that
// — adding `bytes text` here would break it, which is the point.
message ClipboardSubject {
  uint32 byte_count = 1;      // how much was copied (metadata; a size is not content)
  string display_server = 2;  // "x11" | "wayland" — which capture path observed it
}

// ObjectSubject is an object found AT REST in an S3-compatible store by a discovery sweep (DSPM-1).
//
// STRUCTURED RATHER THAN A URI IN resolved_path, and that was a decision reversed on contact with the
// contract. The conservative-looking option was to reuse FilesystemSubject and carry "s3://bucket/key" as a
// path — no new message, no contract growth. But this `target` oneof EXISTS so a producer can carry its own
// shape, and ClipboardSubject and PrintSubject are the precedent: each arrived with a kind and a subject.
// Cramming an object into a filesystem path would have worked and would have made every policy that wants
// "bucket = finance-exports" parse a string, while making an object indistinguishable from a real file
// except by a scheme prefix. Adding an arm here is how the contract is designed to grow, not a change to
// the frozen core.
//
// Content-free like its siblings. size_bytes is the store's reported size of the WHOLE object, which is
// deliberately NOT the amount examined — a sweep reads a bounded prefix, so a large object is reported at
// its true size and covered only in part, and conflating the two would let a partial scan read as a full
// one. bytes_examined records what was actually looked at, so the gap is visible on the event itself.
message ObjectSubject {
  string store = 1;          // the endpoint the object lives in (host only — never credentials)
  string bucket = 2;
  string key = 3;
  int64 size_bytes = 4;      // the object's FULL size as the store reports it
  int64 bytes_examined = 5;  // how much was actually read — less than size_bytes means partial coverage
  ObjectAccess access = 6;   // who can read it (DSPM-2) — absent when the sweep did not establish it
}

// ObjectExposure is who can read a bucket.
//
// THE ZERO VALUE IS "COULD NOT BE DETERMINED", NOT "PRIVATE", and that is the whole point of the enum
// rather than a bool. A discovery credential often lists objects without being permitted to read the
// bucket's ACL or policy, and a scanner that reports the resulting silence as "private" produces the one
// answer nobody ever re-checks. A policy written against this must therefore treat UNSPECIFIED as a
// question, not as an all-clear — and because UNSPECIFIED is the proto default, a policy that forgets to
// gets no reassurance from a field that was never set.
enum ObjectExposure {
  OBJECT_EXPOSURE_UNSPECIFIED = 0;
  OBJECT_EXPOSURE_PRIVATE = 1;
  // Readable by any AUTHENTICATED principal of the store, which on a public cloud means any account in the
  // world — not any account of yours. Kept apart from PUBLIC (S3's own block-public-access rules lump the
  // two together) because they are different findings to whoever has to act on them.
  OBJECT_EXPOSURE_AUTHENTICATED = 2;
  OBJECT_EXPOSURE_PUBLIC = 3;
}

// ObjectEncryption is whether the bucket encrypts new objects by default. Three-valued for the same reason
// ObjectExposure is: a probe that was refused is not a bucket that is unencrypted.
enum ObjectEncryption {
  OBJECT_ENCRYPTION_UNSPECIFIED = 0;
  OBJECT_ENCRYPTION_ABSENT = 1;
  OBJECT_ENCRYPTION_PRESENT = 2;
}

// ObjectAccess is the access context of the bucket an object was discovered in (DSPM-2).
//
// Discovery alone ranks nothing: a bucket of customer records the whole internet can read and one only a
// service role can read produce identical findings, and an operator handed both has to check each by hand —
// the work the sweep was supposed to have done. This is the field that turns a list into a queue.
//
// CONFIGURATION, NOT CONTENT. Everything here describes how the bucket is exposed, never what is in it; the
// content-free rule (D10/D29) is untouched, and reasons/unchecked quote the store's own configuration
// vocabulary rather than any object.
message ObjectAccess {
  ObjectExposure exposure = 1;
  ObjectEncryption encryption = 2;
  // True when a public grant EXISTS but a block-public-access setting neuters it — so the exposure reads
  // private while the grant is still there to be re-enabled by removing one setting. Only the two settings
  // that affect EXISTING access count (IgnorePublicAcls, RestrictPublicBuckets); the two that merely reject
  // future calls change nothing about today, and counting them here would file a live exposure as safe.
  bool blocked = 3;
  // Why the exposure is what it is, in an operator's words, so a finding is actionable without re-probing.
  repeated string reasons = 4;
  // Each probe that could NOT run, and why. NON-EMPTY MEANS THIS PICTURE IS INCOMPLETE — the field exists
  // so a partial answer cannot be mistaken for a clean one (D31).
  repeated string unchecked = 5;
}

// PrintSubject is a print job the endpoint intercepted in the spooler's filter chain (DLP-2b).
//
// Content-free, and one field is content-free by DELIBERATE OMISSION: there is no job title. A document's
// title routinely IS the sensitive fact ("Q3 layoffs.docx", "patient-1234-results.pdf"), so the event
// records only WHETHER a title was present, never the string. The document itself goes to the sandboxed
// worker for classification and never onto an Event (D10/D29).
message PrintSubject {
  string printer = 1;          // destination queue name (metadata, not content)
  string job_user = 2;         // the submitting user as the spooler reports it
  uint32 byte_count = 3;       // how much was submitted
  bool job_title_present = 4;  // whether a title existed — NEVER the title itself
}
